<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiet Search Link</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f2;
        --fg: #22231f;
        --muted: #6f7469;
        --hover: #3f4638;
        --focus: #7a8b6f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151713;
          --fg: #e9ebdf;
          --muted: #a6ad9b;
          --hover: #d5dcc7;
          --focus: #a9bd98;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, color-mix(in srgb, var(--muted) 10%, transparent), transparent 36%), var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 2rem, 32rem);
        text-align: center;
      }

      .quiet-link,
      .quiet-link:visited {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.55rem 0.8rem;
        border-radius: 999px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.92rem;
        letter-spacing: 0.01em;
        transition: color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
      }

      .quiet-link:hover {
        color: var(--hover);
        background: color-mix(in srgb, var(--muted) 10%, transparent);
      }

      .quiet-link:focus-visible {
        outline: none;
        box-shadow: 0 0 0 0.2rem color-mix(in srgb, var(--focus) 38%, transparent);
      }

      .quiet-link__mark {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main aria-label="Discreet search shortcut">
      <a class="quiet-link" href="https://duckduckgo.com/" aria-label="Open DuckDuckGo search">
        <span class="quiet-link__mark" aria-hidden="true"></span>
        <span>search</span>
      </a>
    </main>
  </body>
</html>
